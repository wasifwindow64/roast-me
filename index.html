<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roast Me — Wasif Games</title>
<meta name="description" content="Roast Me by Wasif Games — type something about yourself and get roasted, playfully. Free browser game, no download needed." />
<meta name="keywords" content="Wasif Games, Roast Me, roast me game, Wasif, funny roast generator" />
<meta name="author" content="Wasif" />
<meta property="og:title" content="Roast Me — Wasif Games" />
<meta property="og:description" content="Type something about yourself and get roasted, playfully. A free browser game by Wasif Games." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191413;
    --panel: #241D1B;
    --flame1: #FF5F3E;
    --flame2: #FFB23E;
    --text: #F5EDE7;
    --text-dim: rgba(245,237,231,0.55);
    --line: rgba(245,237,231,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 0%, rgba(255,95,62,0.14), transparent 55%),
                       radial-gradient(circle at 90% 100%, rgba(255,178,62,0.10), transparent 50%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .wrap { width: 100%; max-width: 520px; }

  .brand {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 22px;
  }
  .brand b { color: var(--flame2); font-weight: 700; }

  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--flame2);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 44px;
    line-height: 1.02;
    color: var(--text);
    margin: 0 0 14px;
    text-transform: uppercase;
  }
  h1 span { color: var(--flame1); }
  .sub {
    font-size: 14.5px;
    color: var(--text-dim);
    line-height: 1.6;
    margin: 0 0 34px;
    max-width: 400px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 24px;
  }

  /* Gender select screen */
  #selectScreen .choices {
    display: flex;
    gap: 12px;
  }
  .choice-btn {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 22px 10px;
    cursor: pointer;
    text-align: center;
  }
  .choice-btn:hover { border-color: rgba(255,95,62,0.5); }
  .choice-icon { font-size: 26px; display: block; margin-bottom: 8px; }

  /* Roast screen */
  #roastScreen { display: none; }
  #roastScreen.show { display: block; }

  .tag-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .tag {
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--flame2);
  }
  .change-link {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  textarea#input {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14.5px;
    line-height: 1.6;
    padding: 14px 16px;
    resize: vertical;
    outline: none;
  }
  textarea#input:focus { border-color: rgba(255,95,62,0.5); }
  textarea#input::placeholder { color: rgba(245,237,231,0.3); }

  #err {
    display: none;
    font-size: 13px;
    color: var(--flame1);
    margin-top: 10px;
  }

  button#go {
    margin-top: 16px;
    width: 100%;
    background: linear-gradient(90deg, var(--flame1), var(--flame2));
    border: none;
    border-radius: 3px;
    color: #1a1210;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 20px;
    cursor: pointer;
  }
  button#go:active { transform: scale(0.99); }

  #resultBox {
    display: none;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  #resultBox.show { display: block; }
  .result-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--flame2);
    margin-bottom: 8px;
  }
  #resultText {
    font-size: 17px;
    line-height: 1.6;
    color: var(--text);
    margin: 0;
  }
  #again {
    margin-top: 18px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 10px 16px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
  }

  footer {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">A <b>WASIF GAMES</b> production</div>
  <div class="eyebrow">NO MERCY, LIGHT TOUCH</div>
  <h1>Roast <span>me</span></h1>
  <p class="sub">Type something about yourself — a habit, a choice, a recent decision — and get roasted for it.</p>

  <div class="panel">
    <!-- Gender select -->
    <div id="selectScreen">
      <label>WHO'S GETTING ROASTED</label>
      <div class="choices">
        <button class="choice-btn" data-mode="female"><span class="choice-icon">&#9825;</span>Female</button>
        <button class="choice-btn" data-mode="male"><span class="choice-icon">&#9760;</span>Male</button>
      </div>
    </div>

    <!-- Roast screen -->
    <div id="roastScreen">
      <div class="tag-row">
        <span class="tag" id="modeTag">MODE: FEMALE — LIGHT TOUCH</span>
        <button class="change-link" id="changeMode">change</button>
      </div>
      <label for="input">WHAT SHOULD I ROAST YOU FOR</label>
      <textarea id="input" rows="3" placeholder="e.g. mein subha 11 baje uthta hoon aur bolta hoon busy hoon"></textarea>
      <div id="err">Likho kuch pehle.</div>
      <button id="go">Roast me</button>

      <div id="resultBox">
        <div class="result-label">THE ROAST</div>
        <p id="resultText"></p>
        <button id="again">Roast me again</button>
      </div>
    </div>
  </div>

  <footer>Wasif Games — works fully offline, in any browser.</footer>
</div>

<script>
const selectScreen = document.getElementById('selectScreen');
const roastScreen = document.getElementById('roastScreen');
const modeTag = document.getElementById('modeTag');
const changeMode = document.getElementById('changeMode');
const input = document.getElementById('input');
const err = document.getElementById('err');
const goBtn = document.getElementById('go');
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');
const againBtn = document.getElementById('again');

let currentMode = null;

const data = {
  female: {
    label: "MODE: FEMALE — LIGHT TOUCH",
    generic: [
      "Ye sun kar lagta hai zindagi mein thora aur drama chahiye.",
      "Itna confidence se bata rahi ho jaise ye achievement ho — cute hai.",
      "Sach bataun? Suna kar bhi koi farq nahi para — yehi funny baat hai.",
      "Har kisi ki apni kamzori hoti hai — tumhari abhi confirm ho gayi, halke se."
    ],
    categories: {
      sleep: { keywords: ['soya', 'uthti', 'neend', 'sleep', 'jaga', 'late uth', 'subha der'],
        lines: ["Neend itni pyari hai tumhe ke alarm ne bhi hope chor di hai.",
                "Din shuru hota hai jab baaki logon ka lunch ho chuka hota hai — legend ho sach mein."] },
      busy: { keywords: ['busy', 'kaam', 'mashghol', 'time nahi', 'wela nahi'],
        lines: ["'Busy hoon' bol kar jitna time bachate ho, utne mein kaam khatam ho jata.",
                "Busy hone ka acting itna strong hai ke Netflix bhi seekh le tumse."] },
      food: { keywords: ['khana', 'burger', 'kha liya', 'khaya', 'food', 'chai'],
        lines: ["Diet chart banate ho aur usi din khud violate bhi kar dete ho — talent hai ye.",
                "Chai ke bina zindagi adhoori hai, per kaam ke bina bhi chalti nazar aati hai."] },
      school: { keywords: ['school', 'college', 'padhai', 'exam', 'homework', 'class'],
        lines: ["Padhai itni seriously lete ho ke exam se ek din pehle syllabus 'discover' hota hai.",
                "School jate ho, per attention class ke bahar reh jati hai kahin."] },
      phone: { keywords: ['phone', 'mobile', 'scroll', 'instagram', 'tiktok', 'whatsapp'],
        lines: ["'5 minute scroll karti hoon' bol kar ghante nikal jate hain — koi naya law hai ye.",
                "Battery se zyada tumhari attention span kam charge hoti hai scroll karte karte."] },
      market: { keywords: ['market', 'shopping', 'bazar', 'kharida'],
        lines: ["Shopping list banate ho, per follow karna bhool jate ho — list sirf decoration hai.",
                "Market gayi, per jo lena tha wo bhool aayi — classic move."] }
    }
  },
  male: {
    label: "MODE: MALE — FULL SEND",
    generic: [
      "Bhai ye baat bol kar tumhe laga hero lagoge? Nahi laga.",
      "Itna confidence hai bhai, jaise ye koi flex ho — nahi hai.",
      "Sach ye hai — is baat pe khud bhi hasna chahiye tumhe, warna hum hain hi.",
      "Har banda apni ek kamzori chupata hai, tumhari abhi public ho gayi."
    ],
    categories: {
      sleep: { keywords: ['soya', 'uthta', 'neend', 'sleep', 'jaga', 'late uth', 'subha der'],
        lines: ["Itni der so kar uthte ho ke suraj bhi soch mein par jata hai 'ye zinda bhi hai?'.",
                "Alarm 5 baar lagate ho, phir bhi 12 baje uthte ho — ye alarm ki nahi tumhari haar hai."] },
      busy: { keywords: ['busy', 'kaam', 'mashghol', 'time nahi', 'wela nahi'],
        lines: ["Busy hone ka acting itna strong hai ke Netflix bhi tumse acting seekh le.",
                "Tumhari busy-ness aur tumhara WiFi dono kabhi consistent nahi rahe."] },
      food: { keywords: ['khana', 'burger', 'kha liya', 'khaya', 'food', 'chai'],
        lines: ["Khane ka itna shauk hai ke fridge tumhe dekh kar darta hai.",
                "Gym join karne ka soch rahe ho 2 saal se, burger order karna 2 second mein ho jata hai."] },
      school: { keywords: ['school', 'college', 'padhai', 'exam', 'homework', 'class'],
        lines: ["Homework ka intezar rehta hai ke wo khud aakar bole 'bhai mujhe kar lo'.",
                "Exam se ek raat pehle jitni mehnat karte ho, agar saal bhar karte to topper hote."] },
      phone: { keywords: ['phone', 'mobile', 'scroll', 'instagram', 'tiktok', 'whatsapp'],
        lines: ["Phone itna paas rehta hai ke lagta hai wo tumhara organ ban chuka hai.",
                "'5 minute scroll karta hoon' bol kar ghante nikal jate hain — physics ka naya law hai ye."] },
      work: { keywords: ['job', 'office', 'deadline', 'boss', 'meeting'],
        lines: ["Deadline se ek raat pehle jitni energy aati hai, wo poore hafte kahin gayab rehti hai.",
                "Productivity tab peak pe hoti hai jab actually procrastinate karna hota hai."] },
      market: { keywords: ['market', 'shopping', 'bazar', 'kharida'],
        lines: ["Market gaye, per jo lena tha wo bhool aaye — classic move.",
                "Bazar itni baar jate ho ke dukandar bhi tumhe naam se pehchan gaya hoga."] }
    }
  }
};

function pickRoast(text, mode) {
  const lower = text.toLowerCase();
  const set = data[mode];
  const matched = [];
  for (const key in set.categories) {
    const cat = set.categories[key];
    for (const kw of cat.keywords) {
      if (lower.indexOf(kw) !== -1) {
        matched.push(...cat.lines);
        break;
      }
    }
  }
  const pool = matched.length ? matched : set.generic;
  return pool[Math.floor(Math.random() * pool.length)];
}

function selectMode(mode) {
  currentMode = mode;
  modeTag.textContent = data[mode].label;
  selectScreen.style.display = 'none';
  roastScreen.classList.add('show');
  resultBox.classList.remove('show');
  input.value = '';
  err.style.display = 'none';
}

document.querySelectorAll('.choice-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ selectMode(btn.dataset.mode); });
});

changeMode.addEventListener('click', function(){
  roastScreen.classList.remove('show');
  selectScreen.style.display = 'block';
});

function roast() {
  const val = input.value.trim();
  if (!val) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  resultText.textContent = pickRoast(val, currentMode);
  resultBox.classList.add('show');
}

goBtn.addEventListener('click', roast);
againBtn.addEventListener('click', roast);
input.addEventListener('input', function(){ if (input.value.trim()) err.style.display = 'none'; });
</script>
</body>
</html>
